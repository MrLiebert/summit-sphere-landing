# ============================================================================
# Publicar la landing de Summit-Sphere en Cloudflare Workers (static assets)
#
# Cada push a `main` sube index.html + script.js + styles.css al Worker
# `summit-sphere-landing` (definido en wrangler.jsonc), que sirve
# summit-sphere.com y www.
#
# Secretos (Settings → Secrets and variables → Actions → Repository secrets):
#   CLOUDFLARE_API_TOKEN    Cloudflare → My Profile → API Tokens. Permiso:
#                           Account · Workers Scripts · Edit (sólo esa cuenta).
#   CLOUDFLARE_ACCOUNT_ID   Cloudflare → Workers & Pages → columna derecha.
#
# ⚠️ Sólo se publica la carpeta `dist/` que arma el paso de abajo: así no se
#    suben .github/, wrangler.jsonc ni nada más del repo.
# ============================================================================

name: Publicar landing

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: landing-produccion
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Armar dist/
        run: |
          mkdir -p dist
          cp index.html script.js styles.css dist/
          # Si después se agregan imágenes o favicon, van en assets/ y se copian aquí.
          [ -d assets ] && cp -r assets dist/ || true
          ls -la dist

      - name: Publicar en Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # La versión que trae la action por defecto (3.x) es vieja para
          # static assets. Se fija una 4.x conocida.
          wranglerVersion: '4.20.0'
          command: deploy
